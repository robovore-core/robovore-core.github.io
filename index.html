<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101211">
  <meta name="description" content="A home for projects and experiments by Robovore.">
  <title>ROBOVORE — Project Hub</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #101211;
      color: #f0f3ed;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 50% 0, #1d2720 0, #101211 48%);
    }

    a { color: inherit; }
    a:focus-visible { outline: 2px solid #c5f477; outline-offset: 4px; }

    .container {
      width: min(1120px, calc(100% - 48px));
      margin: 0 auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 28px 0;
      border-bottom: 1px solid #343b35;
    }

    .brand {
      color: #f0f3ed;
      font-size: 1rem;
      font-weight: 800;
      letter-spacing: .14em;
      text-decoration: none;
    }

    .header-link, .eyebrow, .section-label, .tag, .card-number, .source, footer {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .header-link {
      color: #bbc5b9;
      font-size: .8rem;
      text-decoration: none;
    }

    .header-link:hover, .source:hover { color: #c5f477; }

    main { padding: clamp(72px, 10vw, 128px) 0 96px; }

    .eyebrow, .section-label {
      color: #b6e876;
      font-size: .75rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .eyebrow { margin: 0 0 20px; }

    h1 {
      margin: 0;
      font-size: clamp(3rem, 9vw, 7rem);
      line-height: .95;
      letter-spacing: -.06em;
    }

    .subtitle {
      max-width: 520px;
      margin: 24px 0 0;
      color: #aab5a9;
      font-size: clamp(1rem, 2vw, 1.15rem);
      line-height: 1.7;
    }

    .section-heading {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 80px 0 24px;
    }

    .section-label { margin: 0; white-space: nowrap; }
    .section-heading::after { content: ""; height: 1px; flex: 1; background: #343b35; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
      gap: 16px;
    }

    .card {
      display: flex;
      flex-direction: column;
      min-height: 300px;
      padding: 28px;
      border: 1px solid #343b35;
      border-radius: 12px;
      background: #181c19;
      transition: border-color .2s ease, transform .2s ease;
    }

    .card:hover { border-color: #839b70; transform: translateY(-3px); }
    .card-number { color: #879486; font-size: .75rem; }
    .card h3 { margin: 24px 0 10px; font-size: 1.4rem; letter-spacing: -.03em; }
    .description { margin: 0; color: #aab5a9; font-size: .95rem; line-height: 1.6; }
    .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 28px; }

    .tag {
      padding: 5px 8px;
      border: 1px solid #3b4839;
      border-radius: 4px;
      color: #c2d0bd;
      font-size: .7rem;
    }

    .card-actions { display: flex; align-items: center; flex-wrap: wrap; gap: 20px; margin-top: auto; }

    .launch {
      padding: 11px 15px;
      border-radius: 5px;
      background: #c5f477;
      color: #151c10;
      font-size: .85rem;
      font-weight: 750;
      text-decoration: none;
    }

    .launch:hover { background: #d7ff9a; }
    .source { color: #bbc5b9; font-size: .8rem; text-decoration: none; }
    footer { padding: 24px 0 32px; border-top: 1px solid #343b35; color: #879486; font-size: .75rem; }

    @media (max-width: 480px) {
      .container { width: calc(100% - 32px); }
      header { padding: 22px 0; }
      main { padding-bottom: 64px; }
      .section-heading { margin-top: 64px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .card { transition: none; }
      .card:hover { transform: none; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <a class="brand" href="./">ROBOVORE</a>
      <a class="header-link" href="https://github.com/robovore-core">GitHub ↗</a>
    </header>

    <main>
      <p class="eyebrow">Independent projects &amp; experiments</p>
      <h1>ROBOVORE</h1>
      <p class="subtitle">A home for things I build, explore, and put out into the world.</p>

      <section aria-labelledby="projects-heading">
        <div class="section-heading">
          <h2 class="section-label" id="projects-heading">Selected projects</h2>
        </div>
        <div class="grid" id="projects"></div>
        <noscript>Enable JavaScript to see the project list.</noscript>
      </section>
    </main>

    <footer>ROBOVORE / PROJECT HUB</footer>
  </div>

  <script>
    const projects = [
      {
        name: "MARIK",
        description: "An experiment built with React and TypeScript.",
        tags: ["React", "TypeScript", "Vite"],
        livePath: "./marik/",
        repoUrl: "https://github.com/robovore-core/marik"
      },
      {
        name: "Project Two",
        description: "A placeholder for the next project. Replace this with your own.",
        tags: ["Placeholder", "In progress"],
        livePath: "./project-two/",
        repoUrl: "https://github.com/robovore-core/project-two"
      },
      {
        name: "Project Three",
        description: "Another space for an idea, experiment, or future app.",
        tags: ["Placeholder", "Experiment"],
        livePath: "./project-three/",
        repoUrl: "https://github.com/robovore-core/project-three"
      }
    ];

    const grid = document.getElementById("projects");

    projects.forEach((project, index) => {
      const card = document.createElement("article");
      card.className = "card";

      const number = document.createElement("span");
      number.className = "card-number";
      number.textContent = String(index + 1).padStart(2, "0") + " / PROJECT";

      const name = document.createElement("h3");
      name.textContent = project.name;

      const description = document.createElement("p");
      description.className = "description";
      description.textContent = project.description;

      const tags = document.createElement("div");
      tags.className = "tags";
      project.tags.forEach((tag) => {
        const label = document.createElement("span");
        label.className = "tag";
        label.textContent = tag;
        tags.appendChild(label);
      });

      const actions = document.createElement("div");
      actions.className = "card-actions";
      const launch = document.createElement("a");
      launch.className = "launch";
      launch.href = project.livePath;
      launch.textContent = "Launch App ↗";
      const source = document.createElement("a");
      source.className = "source";
      source.href = project.repoUrl;
      source.textContent = "Source ↗";
      actions.append(launch, source);

      card.append(number, name, description, tags, actions);
      grid.appendChild(card);
    });
  </script>
</body>
</html>
